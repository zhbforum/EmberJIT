name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format / clang-format 18
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # v6.1.0; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify C++ formatting
        shell: bash
        run: |
          clang-format-18 --version
          git ls-files -z -- '*.cpp' '*.hpp' |
            xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror

  linux:
    name: Linux / Clang
    runs-on: ubuntu-24.04

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout repository
        # v6.1.0; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    name: Linux / Clang sanitizers
    runs-on: ubuntu-24.04

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout repository
        # v6.1.0; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - msvc
          - clang-cl
        config:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        # v6.1.0; full SHA prevents a mutable tag from changing the executed code.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Configure MSVC
        if: matrix.compiler == 'msvc'
        run: >
          cmake
          -S .
          -B build
          -A x64
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Configure clang-cl
        if: matrix.compiler == 'clang-cl'
        run: >
          cmake
          -S .
          -B build
          -A x64
          -T ClangCL
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
